name: gestion_stock
description: "Motorcycle Spare Parts Shop Management - Desktop Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # State Management - BLoC
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Supabase Backend
  supabase_flutter: ^2.8.4

  # HTTP Client
  dio: ^5.7.0

  # Responsive UI
  flutter_screenutil: ^5.9.3

  # PDF Generation for Invoices
  pdf: ^3.11.2
  printing: ^5.14.2

  # CSV Import
  csv: ^6.0.0
  file_picker: ^8.1.7

  # Charts for Statistics
  fl_chart: ^0.70.2

  # Date formatting
  intl: ^0.20.2

  # Functional error handling
  dartz: ^0.10.1

  # Icons
  cupertino_icons: ^1.0.8

  # Google Fonts
  google_fonts: ^6.2.1

  # Shimmer skeleton loading
  shimmer: ^3.0.0

  # UUID generation
  uuid: ^4.5.1

  # Path provider for file saving
  path_provider: ^2.1.5

  # Environment configuration
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  msix: ^3.16.7

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  assets:
    - .env
    - assets/images/app_icon.png
    - assets/images/sidebar_logo.png

msix_config:
  display_name: HajMoto - Gestion de Stock
  publisher_display_name: Nidhal Boumaiza
  publisher: CN=Nidhal Boumaiza
  identity_name: com.nidhal.hajmoto
  msix_version: 1.0.0.0
  logo_path: assets\images\app_icon.png
  start_menu_icon_path: assets\images\app_icon.png
  tile_icon_path: assets\images\app_icon.png
  vs_generated_images_folder_path: assets\images
  icons_background_color: transparent
  architecture: x64
  capabilities: runFullTrust
  install_certificate: true
  sign_msix: true
  output_path: build\windows\installer
  output_name: HajMoto_Setup

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
